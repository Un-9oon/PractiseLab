##
## CyberShield AI — Nginx HTTP Configuration (Phase 1: No HTTPS)
## /etc/nginx/sites-available/cybershield
##
server {
    listen 80;
    listen [::]:80;
    server_name 10.108.95.204 localhost cybershield.local;

    root /var/www/cybershield;
    index index.html;

    # SPA fallback — React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Access and error logs
    access_log /var/log/nginx/cybershield_access.log;
    error_log  /var/log/nginx/cybershield_error.log;
}
